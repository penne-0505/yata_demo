name: Deploy Web to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.5"
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --release --dart-define=YATA_DEMO_MODE=true

      - name: Verify Cloudflare Pages access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          api() {
            local path="$1"
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4${path}"
          }

          echo "Checking Cloudflare API token validity..."
          api "/user/tokens/verify" | jq '{success, errors, messages, result: {status: .result.status}}'

          echo "Checking Pages projects visible to this token/account..."
          api "/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects" \
            | jq '{success, errors, result: [.result[]? | {name, subdomain}]}'

          echo "Checking target Pages project..."
          api "/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/yata-demo" \
            | jq '{success, errors, result: {name: .result.name, subdomain: .result.subdomain}}'

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name=yata-demo
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
