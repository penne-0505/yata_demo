name: Docs CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      # intent: DEC-006 (Docs/docs-template-v1-migration) — legacy docs become
      # managed when edited while the full wrapper remains CI/local identical.
      DD_SCOPE_BASE: 43314d34037e54ad967ea09c809f353e6710f6a8
      DD_SCOPE_DIFF_FILTER: ACMR
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            **/*.md
          config: .markdownlint.jsonc

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run documentation validators
        run: ./scripts/check-docs.sh
