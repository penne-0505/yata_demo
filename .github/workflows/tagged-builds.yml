name: Build and Release (Tagged)

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.35.5"
  APP_DISPLAY_NAME: YATA Demo
  APP_ID: dev.otibo.yatademo

jobs:
  build-platforms:
    name: Build ${{ matrix.build-target }} package
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            build-target: linux
            artifact-path: build/linux/x64/release/appimage/*.AppImage
            artifact-name: yata-demo-linux-appimage
          - os: windows-latest
            build-target: windows
            artifact-path: build/windows/x64/runner/Release/portable/*.zip
            artifact-name: yata-demo-windows-portable
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Enable desktop target (Linux)
        if: matrix.build-target == 'linux'
        run: flutter config --enable-linux-desktop

      - name: Enable desktop target (Windows)
        if: matrix.build-target == 'windows'
        run: flutter config --enable-windows-desktop

      - name: Install Linux build dependencies
        if: matrix.build-target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev wget

      - name: Fetch Flutter dependencies
        run: flutter pub get

      - name: Generate platform icons
        run: dart run icons_launcher:create

      - name: Generate code with build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build release bundle
        run: flutter build ${{ matrix.build-target }} --release --dart-define=YATA_DEMO_MODE=true

      - name: Package Linux AppImage
        if: matrix.build-target == 'linux'
        shell: bash
        run: |
          set -euo pipefail

          BUNDLE_DIR="build/linux/x64/release/bundle"
          APPDIR="build/linux/x64/release/AppDir"
          APPIMAGE_DIR="build/linux/x64/release/appimage"
          DESKTOP_ID="${APP_ID}"

          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin"
          cp -a "$BUNDLE_DIR/." "$APPDIR/usr/bin"

          cat <<'EOF' > "$APPDIR/AppRun"
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export LD_LIBRARY_PATH="$HERE/usr/bin/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          cd "$HERE/usr/bin"
          exec ./yata_demo "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

          cat > "$APPDIR/${DESKTOP_ID}.desktop" <<DESKTOP
          [Desktop Entry]
          Type=Application
          Name=YATA Demo
          Comment=Local demo for YATA order, inventory, menu, and sales workflows
          Exec=yata_demo
          Icon=${DESKTOP_ID}
          Categories=Office;Utility;
          StartupNotify=true
          DESKTOP

          install -Dm644 assets/icon/icon.png "$APPDIR/${DESKTOP_ID}.png"
          install -Dm644 "$APPDIR/${DESKTOP_ID}.desktop" "$APPDIR/usr/share/applications/${DESKTOP_ID}.desktop"
          install -Dm644 assets/icon/icon.png "$APPDIR/usr/share/icons/hicolor/512x512/apps/${DESKTOP_ID}.png"

          wget -O appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

          mkdir -p "$APPIMAGE_DIR"
          rm -f ./*.AppImage

          ARCH=x86_64 ./appimagetool --appimage-extract-and-run "$APPDIR"

          GENERATED_APPIMAGE="$(ls -1 *.AppImage | head -n 1)"
          if [ -z "$GENERATED_APPIMAGE" ]; then
            echo "::error::Failed to generate AppImage"
            exit 1
          fi

          VERSION="${GITHUB_REF_NAME:-linux}"
          TARGET_APPIMAGE="$APPIMAGE_DIR/YATA-Demo-${VERSION}-linux-x86_64.AppImage"
          mv "$GENERATED_APPIMAGE" "$TARGET_APPIMAGE"
          echo "AppImage created at $TARGET_APPIMAGE"

      - name: Package Windows portable zip
        if: matrix.build-target == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:GITHUB_REF_NAME
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = 'windows'
          }

          $releaseDir = Join-Path (Get-Location) 'build\windows\x64\runner\Release'
          $exePath = Join-Path $releaseDir 'yata_demo.exe'
          if (-not (Test-Path $exePath)) {
            Write-Host '=== Release directory structure ==='
            Get-ChildItem -Path $releaseDir -Recurse -ErrorAction SilentlyContinue | ForEach-Object FullName
            throw "Portable executable not found: $exePath"
          }

          $portableRoot = Join-Path $releaseDir 'portable\YATA Demo'
          $zipDir = Join-Path $releaseDir 'portable'
          New-Item -ItemType Directory -Force -Path $portableRoot | Out-Null

          Get-ChildItem -Path $releaseDir -Force |
            Where-Object { $_.Name -ne 'portable' } |
            Copy-Item -Destination $portableRoot -Recurse -Force

          $zipPath = Join-Path $zipDir "YATA-Demo-$version-windows-x64-portable.zip"
          if (Test-Path $zipPath) {
            Remove-Item -Path $zipPath -Force
          }
          Compress-Archive -Path $portableRoot -DestinationPath $zipPath -CompressionLevel Optimal
          Write-Host "Portable zip created at $zipPath"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-platforms
    steps:
      - name: Download Linux AppImage
        uses: actions/download-artifact@v4
        with:
          name: yata-demo-linux-appimage
          path: release-assets/linux

      - name: Download Windows portable zip
        uses: actions/download-artifact@v4
        with:
          name: yata-demo-windows-portable
          path: release-assets/windows-portable

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail

          TAG_NAME="${GITHUB_REF_NAME}"
          DIST_DIR="release-assets/dist"
          mkdir -p "$DIST_DIR"

          LINUX_APPIMAGE="$(find release-assets/linux -name '*.AppImage' -type f | head -n 1)"
          if [ -z "$LINUX_APPIMAGE" ]; then
            echo "::error::No AppImage found in release-assets/linux"
            ls -R release-assets/linux || true
            exit 1
          fi
          cp "$LINUX_APPIMAGE" "$DIST_DIR/YATA-Demo-${TAG_NAME}-linux-x86_64.AppImage"

          WINDOWS_ZIP="$(find release-assets/windows-portable -name '*.zip' -type f | head -n 1)"
          if [ -z "$WINDOWS_ZIP" ]; then
            echo "::error::No Windows portable zip found in release-assets/windows-portable"
            ls -R release-assets/windows-portable || true
            exit 1
          fi
          cp "$WINDOWS_ZIP" "$DIST_DIR/YATA-Demo-${TAG_NAME}-windows-x64-portable.zip"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            release-assets/dist/YATA-Demo-${{ github.ref_name }}-linux-x86_64.AppImage
            release-assets/dist/YATA-Demo-${{ github.ref_name }}-windows-x64-portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-discord:
    name: Announce Release to Discord
    runs-on: ubuntu-latest
    needs: publish-release
    steps:
      - name: Get release info and post to Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${WEBHOOK_URL:-}" ]; then
            echo "DISCORD_RELEASE_WEBHOOK is not set. Skipping Discord notification."
            exit 0
          fi

          RELEASE_JSON=$(curl -sS -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$REPO/releases/tags/$TAG")

          RELEASE_URL=$(echo "$RELEASE_JSON" | jq -r '.html_url // ""')
          RELEASE_NAME=$(echo "$RELEASE_JSON" | jq -r '.name // .tag_name // ""')
          RELEASE_AUTHOR=$(echo "$RELEASE_JSON" | jq -r '.author.login // ""')

          if [ -z "$RELEASE_URL" ]; then
            RELEASE_URL="https://github.com/$REPO/releases/tag/$TAG"
          fi
          if [ -z "$RELEASE_AUTHOR" ]; then
            RELEASE_AUTHOR="${{ github.actor }}"
          fi
          if [ -z "$RELEASE_NAME" ]; then
            RELEASE_NAME="$TAG"
          fi

          export RELEASE_URL
          export RELEASE_NAME
          export RELEASE_AUTHOR
          ASSETS_JSON=$(echo "$RELEASE_JSON" | jq -c '.assets // []')
          export ASSETS_JSON

          python3 - <<'PY' | curl -sS -H 'Content-Type: application/json' -d @- "$WEBHOOK_URL"
          import datetime
          import json
          import os

          tag = os.environ["TAG"]
          repo = os.environ["REPO"]
          release_url = os.environ.get("RELEASE_URL", "")
          release_name = os.environ.get("RELEASE_NAME", tag)
          release_author = os.environ.get("RELEASE_AUTHOR", "unknown")
          assets = json.loads(os.environ.get("ASSETS_JSON", "[]"))

          asset_lines = []
          for asset in assets:
            name = asset.get("name", "asset")
            url = asset.get("browser_download_url", "")
            size = asset.get("size", 0)
            asset_lines.append(f"- [{name}]({url}) ({size // 1024} KB)")

          payload = {
            "content": f"新しいリリース **{tag}** を公開しました。\n{repo} by {release_author}\n{release_url}",
            "embeds": [{
              "title": release_name,
              "url": release_url,
              "description": "リリースノートは上記URLを確認してください。",
              "timestamp": datetime.datetime.utcnow().isoformat() + "Z",
              "fields": [
                {"name": "タグ", "value": tag, "inline": True},
                {"name": "リポジトリ", "value": repo, "inline": True},
                {"name": "アセット", "value": "\n".join(asset_lines)[:1000] if asset_lines else "なし", "inline": False},
              ],
              "footer": {"text": "GitHub Releases"},
            }],
            "allowed_mentions": {"parse": []},
          }
          print(json.dumps(payload, ensure_ascii=False))
          PY
